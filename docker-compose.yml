services:
  bot:
    container_name: V2RayBot-bot
    build:
      context: .
      dockerfile: Dockerfile
    command: npm start
    volumes:
      - ./db_backups:/usr/src/app/db_backups
    environment:
      - NODE_ENV=production
      - IS_DOCKER=true
      - BOT_TOKEN=${BOT_TOKEN}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vpnbot-net
    working_dir: /usr/src/app

  postgres:
    container_name: V2RayBot-postgres
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-V2RayBot}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-V2RayBot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-V2RayBot} -d ${DB_NAME:-V2RayBot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vpnbot-net

  redis:
    container_name: V2RayBot-redis
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vpnbot-net

volumes:
  postgres_data:
  redis_data:

networks:
  vpnbot-net:
    driver: bridge
